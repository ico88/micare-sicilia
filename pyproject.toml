[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "micare-sicilia"
version = "0.1.0"
description = "Previsione verificata della resistenza antimicrobica per la Rete MIC Sicilia."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0",
  "Flask-SQLAlchemy>=3.1",
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.1",
  "prophet>=1.1",
  "pyarrow>=15.0",
  "python-calamine>=0.2",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "gunicorn>=21.0",
  "websocket-client>=1.6",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=6.29",
  "ipywidgets>=8.1",
]

[tool.setuptools.packages.find]
where = ["src"]
